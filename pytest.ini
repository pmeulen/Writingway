[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show short summary for all test outcomes
addopts =
    -v
    --tb=short
    --strict-markers

# Custom markers
markers =
    unit: Pure unit tests with no external dependencies
    integration: Tests that touch the filesystem or external services
    qt: Tests that require a QApplication instance

